<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Site Web</title>
    <style>
        /* Styles généraux pour réinitialiser les marges */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Style de la barre de navigation */
        .navbar {
            background-color: #006663; /* Votre couleur verte emerode */
            padding: 15px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 5px #51515178;
        }

        /* Style du logo / titre du site */
        .nav-logo {
            color: #99fffc;
            font-size: 24px;
            font-weight: bold;
        }

        /* Liste des liens de navigation */
        .nav-links {
            list-style: none;
            display: flex;
            gap: 25px; /* Espace entre les mots */
        }

        /* Style de base des mots (liens) */
        .nav-links a {
            color: #ffffff; /* Écrit en blanc */
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: color 0.3s ease; /* Transition fluide pour le survol */
        }

        /* Effet au passage de la souris (Hover) */
        .nav-links a:hover {
            color: #99fffc; /* Nouvelle couleur au survol (vert clair) */
        }

        /* Style pour le contenu principal de la page */
        .content {
            padding: 40px;
            text-align: center;
            color: #333333;
        }

        .content h1 {
            margin-bottom: 15px;
            color: #006600;
        }
    </style>
</head>
<body>

    <!-- Barre de navigation -->
    <nav class="navbar">
        <div class="nav-logo">MonPlateau</div>
        <ul class="nav-links">
            <li><a href="#cours">COURS</a></li>
            <li><a href="#quizz">QUIZZ</a></li>
            <li><a href="#labs">LABS</a></li>
        </ul>
    </nav>

    <!-- Contenu de la page -->
    <main class="content">
        <h1>Bienvenue sur la plateforme</h1>
        <p>Sélectionnez une option dans la barre de navigation ci-dessus.</p>
    </main>

</body>
</html>
